version: '3.8'

services:
  google-home-caller:
    build: .
    container_name: google-home-caller
    network_mode: "host"
    ports:
      - "8602:8602"
    environment:
      - EMAIL=${EMAIL}
      - PASSWORD=${PASSWORD}
    env_file:
      - .env
    volumes:
      - ./profile:/app/profile
      - ./logs:/app/logs
      - selenium-cache:/root/.cache/selenium
    restart: unless-stopped
    # Run with additional capabilities for Chrome
    cap_add:
      - SYS_ADMIN
    # Optional: Use shm_size to avoid Chrome crashes
    shm_size: 2gb

volumes:
  selenium-cache:
